<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grapefruit Trading — Sandbox</title>
<link rel="stylesheet" href="css/investing.css"/>
</head>
<body>

<div id="floor"></div>

<!-- end-of-session summary -->
<div class="modal-backdrop" id="summaryBackdrop">
  <div class="summary-card">
    <h2 id="summaryTitle">Session complete</h2>
    <div class="sub" id="summarySub">Here's how your run played out.</div>
    <div id="recordBadgeWrap"></div>
    <div class="summary-grid">
      <div class="item"><div class="label">Final value</div><div class="val" id="sumFinal">$0</div></div>
      <div class="item"><div class="label">Gain / Loss</div><div class="val" id="sumGain">$0</div></div>
      <div class="item"><div class="label">Personal best</div><div class="val" id="sumBest">$0</div></div>
      <div class="item"><div class="label">Improvement</div><div class="val" id="sumImprove">0%</div></div>
    </div>
    <div class="reward-line" id="sumRewardLine">Reward: <strong id="sumReward">0</strong> coins</div>
    <div class="summary-actions">
      <button class="close-btn" id="summaryCloseBtn">Close</button>
      <button class="play-again" id="playAgainBtn">Play again</button>
    </div>
  </div>
</div>

<script src="data/companies.js"></script>
<script src="data/events.js"></script>
<script src="js/rewards.js"></script>
<script src="js/chart.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/market.js"></script>
<script src="js/trading.js"></script>
<script src="js/app.js"></script>
</body>
</html>
